<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Pranjal Sunariya</title>
  <meta name="description" content="A modular e-commerce product catalog with client-side routing and cart, built by Pranjal Sunariya.">
  <link rel="stylesheet" href="style.css">
  <style>
    .product-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 15px;
    }
    @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 900px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .product-emoji { font-size: 3rem; }
    .product-emoji.large { font-size: 5rem; }
    .product-price { font-weight: bold; font-size: 1.2rem; margin: 8px 0; }
    .product-price.large { font-size: 1.8rem; }
    .product-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .btn-view, .btn-add, #detail-add-btn {
      background-color: var(--header-bg);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link { display: inline-block; margin-bottom: 15px; color: var(--text-color); }
    .product-detail { background: var(--card-bg); padding: 20px; border-radius: 10px; text-align: center; }
    .cart-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .cart-name { flex: 1; min-width: 100px; }
    .qty-input { width: 55px; padding: 5px; }
    .cart-total { font-size: 1.3rem; font-weight: bold; margin: 15px 0; text-align: right; }
    #cart-count {
      background: #d33;
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      padding: 1px 6px;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <h1>Pranjal Sunariya</h1>
    <p>Web Developer</p>

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="todo.html">To-Do List</a></li>
        <li><a href="weather.html">Weather</a></li>
        <li><a href="shop.html" aria-current="page">Shop</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#/cart">🛒 Cart <span id="cart-count">0</span></a></li>
      </ul>
    </nav>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <main id="main">
    <section aria-labelledby="shop-heading">
      <h2 id="shop-heading">Product Catalog</h2>
      <div id="app"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Pranjal Sunariya. All rights reserved.</p>
  </footer>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <script type="module" src="js/app.js"></script>

</body>
</html>
