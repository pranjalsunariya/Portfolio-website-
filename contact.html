<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Pranjal Sunariya</title>
  <meta name="description" content="Get in touch with Pranjal Sunariya through this accessible contact form.">
  <meta property="og:title" content="Contact | Pranjal Sunariya">
  <meta property="og:description" content="Contact Pranjal Sunariya, web developer, via this accessible form.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <h1>Pranjal Sunariya</h1>
    <p>Web Developer</p>

    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">

    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact Me</h2>
      <p>Fill out the form below and I will get back to you soon.</p>

      <form action="#" method="post" novalidate>

        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required aria-required="true">
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required aria-required="true">
        </div>

        <div>
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject">
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
        </div>

        <div aria-live="polite" id="form-status"></div>

        <button type="submit">Send Message</button>

      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Pranjal Sunariya. All rights reserved.</p>
    <nav aria-label="Footer links">
      <ul>
        <li><a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </nav>
  </footer>

</body>
</html>
